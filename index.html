<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">
    <header>
      <h1>Tic&nbsp;·&nbsp;Tac&nbsp;·&nbsp;Toe</h1>
      <p class="subtitle">First to line up three takes the round.</p>
    </header>

    <div class="status-bar" aria-live="polite">
      <span class="turn-indicator" id="turnDot"></span>
      <span id="statusText">Player X's turn</span>
    </div>

    <div class="board-wrap">
      <svg class="win-line" id="winLine" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true">
        <path id="winPath" d=""></path>
      </svg>

      <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
        <button class="cell" data-index="0" role="gridcell" aria-label="Row 1, Column 1"></button>
        <button class="cell" data-index="1" role="gridcell" aria-label="Row 1, Column 2"></button>
        <button class="cell" data-index="2" role="gridcell" aria-label="Row 1, Column 3"></button>
        <button class="cell" data-index="3" role="gridcell" aria-label="Row 2, Column 1"></button>
        <button class="cell" data-index="4" role="gridcell" aria-label="Row 2, Column 2"></button>
        <button class="cell" data-index="5" role="gridcell" aria-label="Row 2, Column 3"></button>
        <button class="cell" data-index="6" role="gridcell" aria-label="Row 3, Column 1"></button>
        <button class="cell" data-index="7" role="gridcell" aria-label="Row 3, Column 2"></button>
        <button class="cell" data-index="8" role="gridcell" aria-label="Row 3, Column 3"></button>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score x">
        <span class="label">Player X</span>
        <span class="value" id="scoreX">0</span>
      </div>
      <div class="score draw">
        <span class="label">Draws</span>
        <span class="value" id="scoreDraw">0</span>
      </div>
      <div class="score o">
        <span class="label">Player O</span>
        <span class="value" id="scoreO">0</span>
      </div>
    </div>

    <div class="controls">
      <button id="newRoundBtn" class="btn primary" type="button">New Round</button>
      <button id="resetMatchBtn" class="btn ghost" type="button">Reset Match</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
